const $ = id => document.getElementById(id);

async function sha1Hex(buf) {
    if (!(window.crypto && crypto.subtle)) return null;
    try {
        const d = await crypto.subtle.digest('SHA-1', buf);
        return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { return null; }
}

async function checkOne(path) {
    const want = EXPECTED[path];
    try {
        // a changing ?nvcheck= value makes sure we see what the server really has, not a saved copy
        const res = await fetch(path + '?nvcheck=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return { path, state: 'missing', note: 'not found on the server (HTTP ' + res.status + ')' };
        const buf = await res.arrayBuffer();
        if (buf.byteLength !== want[0]) {
            const short = buf.byteLength < want[0];
            return { path, state: 'different', note: buf.byteLength + ' bytes found, ' + want[0] + ' expected \u2014 ' +
                (short ? 'cut off or an older version' : 'a newer or edited version') };
        }
        const h = await sha1Hex(buf);
        if (h && h !== want[1]) return { path, state: 'different', note: 'right size but different content \u2014 edited, or another version' };
        return { path, state: 'ok' };
    } catch (e) {
        return { path, state: 'error', note: 'could not be read (' + (e && e.message ? e.message : e) + ')' };
    }
}

async function run() {
    $('problems').innerHTML = ''; $('okfiles').innerHTML = ''; $('allfiles').style.display = 'none'; $('progress').style.width = '0';
    if (location.protocol === 'file:') {
        $('summary').textContent = 'This page can only check a site that is being served (a website, or a local server such as the one in your editor). Files opened straight from disk cannot be checked.';
        return;
    }
    const paths = Object.keys(EXPECTED);
    if (!paths.length) { $('summary').textContent = 'This copy of the page has no file list. Run python3 tools/build.py and upload check.html again.'; return; }

    let done = 0, bad = [];
    const okList = [];
    $('summary').textContent = 'Checking ' + paths.length + ' files\u2026';
    const queue = paths.slice();
    async function worker() {
        while (queue.length) {
            const r = await checkOne(queue.shift());
            done++;
            $('progress').style.width = Math.round(100 * done / paths.length) + '%';
            if (r.state === 'ok') okList.push(r.path); else bad.push(r);
            $('summary').textContent = 'Checked ' + done + ' of ' + paths.length + ' files\u2026';
        }
    }
    await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
    $('progress').style.width = '100%';

    if (!bad.length) {
        $('summary').innerHTML = '<span class="ok"><b>\u2713 All ' + paths.length + ' files are complete and up to date.</b></span>' +
            (window.crypto && crypto.subtle ? '' : '<br><small>(Sizes match; content could not be fingerprinted in this browser.)</small>');
    } else {
        bad.sort((a, b) => a.path.localeCompare(b.path));
        $('summary').innerHTML = '<span class="bad"><b>\u2717 ' + bad.length + ' of ' + paths.length + ' files need attention.</b></span><br>' +
            'Upload ' + (bad.length === 1 ? 'this file' : 'these files') + ' again from the latest zip, then reload the site.';
        const box = document.createElement('div'); box.className = 'box';
        bad.forEach(r => {
            const row = document.createElement('div'); row.className = 'row';
            const name = document.createElement('b'); name.textContent = r.path;
            const note = document.createElement('small'); note.className = 'bad'; note.textContent = r.note;
            row.appendChild(name); row.appendChild(note); box.appendChild(row);
        });
        $('problems').appendChild(box);
    }
    if (okList.length) {
        okList.sort();
        okList.forEach(p => { const d = document.createElement('div'); d.className = 'row'; d.textContent = '\u2713 ' + p; $('okfiles').appendChild(d); });
        $('allfiles').style.display = 'block';
    }
}
$('again').onclick = run;
run();
</script>
