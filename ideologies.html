<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoNeoValues - All Ideologies</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icon.svg">
    <script src="theme.js"></script>
</head>
<body>
    <div class="main-container">
        <h1>All Ideologies</h1>
        <p class="intro-text">Below is a collection of all ideologies included in NeoNeoValues, divided by their political category.</p>

        <div class="nv-filters">
            <input id="f-search" class="nv-input" type="search" placeholder="Search ideologies&hellip;" autocomplete="off">
            <div class="nv-filter-row">
                <select id="f-group" class="nv-input"><option value="">All groups</option></select>
                <input id="f-value" class="nv-input" list="f-value-list" placeholder="Must include value&hellip; (type to search)" autocomplete="off">
            </div>
            <datalist id="f-value-list"></datalist>
            <div id="f-tags" class="nv-chip-row"></div>
            <div class="nv-filter-foot">
                <span id="f-count"></span>
                <a id="f-clear" class="nv-change" href="#" style="display: none;">Clear filters</a>
            </div>
        </div>

        <div id="ideologies-container"></div>

        <div id="buttons" style="margin-top: 40px; padding-bottom: 60px;">
            <button onclick="location.href='index.html'">Back</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="criteria.js"></script>
    <script>
        const container = document.getElementById('ideologies-container');
        const entries = [];   // { el, section, name, group, variants: [Set of value ids] }
        const sections = [];  // { el, entries[] }

        for (const groupName in ideologyGroups) {
            const section = document.createElement('div');
            section.className = 'category-section';

            const title = document.createElement('h2');
            title.className = 'category-title';
            title.innerText = groupName;
            section.appendChild(title);

            const flexContainer = document.createElement('div');
            flexContainer.className = 'values-flex-container';
            const secEntry = { el: section, entries: [] };

            ideologyGroups[groupName].forEach(name => {
                const bubble = document.createElement('a');
                bubble.className = 'label-bubble';
                bubble.href = `description.html?id=${encodeURIComponent(name)}&type=ideology`;
                bubble.innerText = name;
                bubble.style.backgroundColor = labelColors[name] || "#7a7a7a";
                bubble.style.textDecoration = 'none';
                bubble.style.fontSize = "1.1rem";
                bubble.style.margin = "8px";
                bubble.style.padding = "10px 25px";

                // each ideology is a card: name bubble + its criteria chips
                const card = document.createElement('div');
                card.className = 'nv-ideology-card';
                card.appendChild(bubble);
                card.appendChild(nvMakeCriteriaBlock(name));
                flexContainer.appendChild(card);

                const entry = {
                    el: card, name: name.toLowerCase(), group: groupName,
                    variants: nvIdeologyVariants(name).map(parts => new Set(parts))
                };
                entries.push(entry);
                secEntry.entries.push(entry);
            });

            section.appendChild(flexContainer);
            container.appendChild(section);
            sections.push(secEntry);
        }

        // ----- filter controls -----
        const fSearch = document.getElementById('f-search');
        const fGroup = document.getElementById('f-group');
        const fValue = document.getElementById('f-value');
        const fTags = document.getElementById('f-tags');
        const fCount = document.getElementById('f-count');
        const fClear = document.getElementById('f-clear');
        const selectedValues = []; // value ids that must all be present

        Object.keys(ideologyGroups).forEach(g => {
            const o = document.createElement('option'); o.value = g; o.textContent = g; fGroup.appendChild(o);
        });

        // value options labelled "Name (Category)" so they stay unambiguous
        const valueOptionToId = {};
        const list = document.getElementById('f-value-list');
        categories.forEach(cat => {
            Object.keys(resultsMapping[cat]).forEach(id => {
                const label = `${resultsMapping[cat][id]} (${categoryTitles[cat]})`;
                valueOptionToId[label.toLowerCase()] = id;
                const o = document.createElement('option'); o.value = label; list.appendChild(o);
            });
        });

        function tryAddValue() {
            const id = valueOptionToId[fValue.value.trim().toLowerCase()];
            if (!id) return;
            if (!selectedValues.includes(id)) selectedValues.push(id);
            fValue.value = '';
            apply();
        }
        fValue.addEventListener('input', tryAddValue);
        fValue.addEventListener('change', tryAddValue);

        function renderTags() {
            fTags.innerHTML = '';
            selectedValues.forEach(id => {
                const chip = nvMakeChip(id);
                if (!chip) return;
                const x = document.createElement('button');
                x.type = 'button';
                x.className = 'nv-chip-x';
                x.textContent = '\u00D7';
                x.setAttribute('aria-label', 'Remove filter');
                x.onclick = () => { selectedValues.splice(selectedValues.indexOf(id), 1); apply(); };
                chip.appendChild(x);
                fTags.appendChild(chip);
            });
        }

        function apply() {
            const q = fSearch.value.trim().toLowerCase();
            const group = fGroup.value;
            let shown = 0;
            entries.forEach(e => {
                const ok =
                    (!q || e.name.includes(q)) &&
                    (!group || e.group === group) &&
                    (selectedValues.length === 0 ||
                        e.variants.some(v => selectedValues.every(id => v.has(id))));
                e.el.style.display = ok ? '' : 'none';
                if (ok) shown++;
            });
            sections.forEach(s => {
                s.el.style.display = s.entries.some(e => e.el.style.display !== 'none') ? '' : 'none';
            });
            renderTags();
            const active = q || group || selectedValues.length;
            fCount.textContent = active ? `Showing ${shown} of ${entries.length} ideologies` : `${entries.length} ideologies`;
            fClear.style.display = active ? '' : 'none';
        }

        fSearch.addEventListener('input', apply);
        fGroup.addEventListener('change', apply);
        fClear.addEventListener('click', ev => {
            ev.preventDefault();
            fSearch.value = ''; fGroup.value = ''; fValue.value = ''; selectedValues.length = 0; apply();
        });
        apply();
    </script>
</body>
</html>
