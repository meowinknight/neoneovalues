<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoNeoValues</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg" href="icon.svg">
    <script src="theme.js"></script>
</head>
<body>
    <div class="main-container">
    <div class="main-results-wrapper">
        <div class="top-section">
            <div class="title-container">
                <h1>NeoNeoValues</h1>
                <span class="version-text">v3.0</span>
            </div>
            <div id="results-container"></div>
        </div>

        <div class="bottom-section">
            <div id="label"></div>

            <div id="closest-section" class="nv-closest" style="display: none;">
                <h2 class="nv-closest-title">Closest matches</h2>
                <p class="nv-closest-hint">Ranked by how many of an ideology's criteria you share (values from the same family count half).</p>
                <div id="closest-list"></div>
            </div>

            <p class="intro-text results-instruction">
                Click on any icon or label to view its description and original source.
                Use "Change" under an icon to redo just that category.
            </p>

            <div id="buttons" style="margin-top: 30px;">
                <button id="export-btn">Export as PNG</button>
                <button id="compare-btn">Compare with an ideology</button>
                <button onclick="location.href='index.html'">Back to menu</button>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="criteria.js"></script>
    <script src="export.js"></script>
    <script>
        // Read results from the URL first (works everywhere), then from localStorage
        const results = (function () {
            try {
                const r = new URLSearchParams(window.location.search).get('r');
                if (r) {
                    const parsed = JSON.parse(r);
                    try { localStorage.setItem('quizResults', JSON.stringify(parsed)); } catch (e) {}
                    return parsed;
                }
            } catch (e) {}
            try { return JSON.parse(localStorage.getItem('quizResults') || '{}'); } catch (e) { return {}; }
        })();
        const resultsParam = encodeURIComponent(JSON.stringify(results));
        const container = document.getElementById('results-container');
        const userResults = Object.values(results);

        categories.forEach(category => {
            const resultValue = results[category];
            if (!resultValue) return;

            const cell = document.createElement('div');
            cell.className = 'nv-result-cell';

            const wrapper = document.createElement('a');
            wrapper.className = 'result-item';
            wrapper.href = `description.html?id=${resultValue}&cat=${category}`;
            wrapper.style.textDecoration = 'none';
            wrapper.style.color = 'inherit';

            const img = document.createElement('img');
            img.src = `icons/${category}/${resultValue}.svg`;
            img.className = 'result-icon';
            img.onerror = () => { img.style.display = 'none'; };

            const name = document.createElement('p');
            const displayName = (resultsMapping[category] && resultsMapping[category][resultValue])
                ? resultsMapping[category][resultValue]
                : resultValue.replace(/_/g, ' ');
            name.innerText = displayName;
            name.className = 'result-text';

            wrapper.appendChild(img);
            wrapper.appendChild(name);
            cell.appendChild(wrapper);

            // Redo just this category
            const change = document.createElement('a');
            change.className = 'nv-change';
            change.href = `quiz.html?redo=${category}&r=${resultsParam}`;
            change.textContent = '\u21BB Change';
            change.title = `Redo only the ${categoryTitles[category] || category} questions`;
            cell.appendChild(change);

            container.appendChild(cell);
        });

        // ----- your ideology (unchanged logic: most specific fully-matched key wins) -----
        const matchedKey = Object.keys(labelMapping)
            .sort((a, b) => b.split('|').length - a.split('|').length)
            .find(key => key.split('|').every(part => userResults.includes(part)));

        const finalLabel = matchedKey ? labelMapping[matchedKey] : "No exact match";
        const labelDiv = document.getElementById('label');
        labelDiv.className = "label-bubble";
        labelDiv.style.backgroundColor = labelColors[finalLabel] || "#7a7a7a";

        if (matchedKey) {
            labelDiv.innerHTML = `<a href="description.html?id=${encodeURIComponent(finalLabel)}&type=ideology&from=results&r=${resultsParam}" style="color: inherit; text-decoration: none; display: block;">${finalLabel}</a>`;
        } else {
            labelDiv.innerText = finalLabel;
        }

        // ----- top 5 closest ideologies -----
        const closest = nvClosestIdeologies(results, 5, matchedKey ? [finalLabel] : []);
        if (closest.length > 0) {
            const list = document.getElementById('closest-list');
            closest.forEach((c, i) => {
                const pct = Math.round(c.score * 100);
                const row = document.createElement('div');
                row.className = 'nv-closest-row';

                const rank = document.createElement('span');
                rank.className = 'nv-rank';
                rank.textContent = i + 1;

                const main = document.createElement('div');
                main.className = 'nv-closest-main';

                const link = document.createElement('a');
                link.className = 'nv-pill';
                link.href = `description.html?id=${encodeURIComponent(c.name)}&type=ideology&from=results&r=${resultsParam}`;
                link.textContent = c.name;
                link.style.backgroundColor = labelColors[c.name] || '#7a7a7a';

                const bar = document.createElement('div');
                bar.className = 'nv-bar';
                const fill = document.createElement('div');
                fill.className = 'nv-bar-fill';
                fill.style.width = pct + '%';
                bar.appendChild(fill);

                const meta = document.createElement('div');
                meta.className = 'nv-closest-meta';
                let txt = `${pct}% \u00B7 ${c.exact} of ${c.total} criteria`;
                if (c.close) txt += ` (+${c.close} close)`;
                meta.textContent = txt;

                main.appendChild(link);
                main.appendChild(bar);
                main.appendChild(meta);

                const cmp = document.createElement('a');
                cmp.className = 'nv-change';
                cmp.href = `compare.html?a=you&b=${encodeURIComponent(c.name)}&r=${resultsParam}`;
                cmp.textContent = 'Compare';

                row.appendChild(rank);
                row.appendChild(main);
                row.appendChild(cmp);
                list.appendChild(row);
            });
            document.getElementById('closest-section').style.display = 'block';
        }


        // ----- export as PNG -----
        const exportBtn = document.getElementById('export-btn');
        if (!categories.some(c => results[c])) exportBtn.style.display = 'none';
        exportBtn.onclick = async () => {
            const original = exportBtn.textContent;
            exportBtn.disabled = true;
            exportBtn.textContent = 'Rendering image\u2026';
            try {
                const data = {
                    values: categories.filter(c => results[c]).map(c => ({
                        cat: c,
                        id: results[c],
                        name: (resultsMapping[c] && resultsMapping[c][results[c]]) || results[c].replace(/_/g, ' '),
                        catTitle: categoryTitles[c] || c
                    })),
                    match: matchedKey ? { name: finalLabel, color: labelColors[finalLabel] } : null,
                    closest: closest.map(c => ({
                        name: c.name,
                        color: labelColors[c.name],
                        pct: Math.round(c.score * 100),
                        exact: c.exact, total: c.total, close: c.close
                    }))
                };
                const blob = await nvRenderResultsPng(data);
                const slug = (matchedKey ? finalLabel : 'results').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
                nvShowExportPreview(blob, 'neoneovalues-' + slug + '.png');
            } catch (err) {
                console.error(err);
                alert('Sorry, the image could not be created: ' + err.message);
            } finally {
                exportBtn.disabled = false;
                exportBtn.textContent = original;
            }
        };

        document.getElementById('compare-btn').onclick = () => {
            location.href = `compare.html?a=you${matchedKey ? '&b=' + encodeURIComponent(finalLabel) : ''}&r=${resultsParam}`;
        };
    </script>
    </div>
</body>
</html>
